name: Finalize Story 1.2 records

on:
  push:
    branches:
      - story/1-2-youtube-metadata
    paths:
      - .github/workflows/finalize-story-1-2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/1-2-youtube-metadata
          fetch-depth: 0

      - name: Update BMAD records
        run: |
          python <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          story = Path('_bmad-output/implementation-artifacts/1-2-dan-va-kiem-tra-video-youtube.md')
          text = story.read_text()
          text = text.replace('Status: ready-for-dev', 'Status: done', 1)
          text = text.replace('- [ ]', '- [x]')
          if '## Completion Record' not in text:
              text += '''\n\n## Completion Record\n\n- Status: done\n- Pull request: #2\n- Final CI: run 30840172223 — typecheck, lint, unit/integration tests, production build, 20 desktop/mobile Playwright journeys, Supabase migration and RLS tests all passed.\n- Adversarial review: resolved provider configuration classification, Zod validation at response boundaries, contradictory region-policy handling, stale preview/error behavior and operational documentation.\n- Scope boundary preserved: no CEFR selection, generation job, transcript or lesson generation was added.\n'''
          story.write_text(text)

          sprint = Path('_bmad-output/implementation-artifacts/sprint-status.yaml')
          status = sprint.read_text()
          now = datetime.now(timezone(timedelta(hours=7))).replace(microsecond=0).isoformat()
          import re
          status = re.sub(r'# last_updated: .*', f'# last_updated: {now}', status, count=1)
          status = re.sub(r'last_updated: ".*"', f'last_updated: "{now}"', status, count=1)
          status = status.replace('  1-2-dan-va-kiem-tra-video-youtube: ready-for-dev', '  1-2-dan-va-kiem-tra-video-youtube: done', 1)
          sprint.write_text(status)

          Path('.github/workflows/finalize-story-1-2.yml').unlink()
          PY

      - name: Commit finalized records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: complete Story 1.2 records"
          git push origin HEAD:story/1-2-youtube-metadata
