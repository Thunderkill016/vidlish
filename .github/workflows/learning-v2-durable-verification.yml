name: Learning v2 durable verification

on:
  push:
    branches:
      - ci/learning-v2-persistence-verification

permissions:
  contents: read

concurrency:
  group: learning-v2-durable-verification
  cancel-in-progress: true

jobs:
  verify:
    name: Verify durable Golden Session
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: "true"
      AUTH_ADAPTER: fake
      AUTH_FAKE_CODE: "123456"
      TEST_BETA_EMAILS: learning-preview@example.com
      VIDEO_METADATA_ADAPTER: fixture
      GENERATION_REPOSITORY: fake
      GENERATION_DISPATCHER: inline
      TRANSCRIPT_NATIVE_ADAPTER: fixture
      TRANSCRIPT_REPOSITORY: fake
      LESSON_PROVIDER: fixture
      LEARNING_SESSION_REPOSITORY: supabase
      LEARNING_LAB_V2_LESSON_VERSION_ID: 77777777-7777-4777-8777-777777777777
      NEXT_PUBLIC_AUTH_RESEND_COOLDOWN_SECONDS: "1"
    steps:
      - name: Checkout exact verification commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck persistence slice
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
        run: pnpm typecheck

      - name: Run learning persistence unit tests
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
        run: >-
          pnpm exec vitest run
          src/adapters/supabase/learning-session-repository.test.ts
          src/modules/learning/application/submit-learning-activity-attempt.test.ts
          src/modules/learning/application/submit-learning-activity-attempt-progression.test.ts
          src/modules/learning/application/learning-runtime-progress.test.ts

      - name: Rebuild isolated Supabase from migrations and seed
        run: |
          supabase start
          supabase db reset --local --yes
          supabase test db

      - name: Export isolated Supabase credentials
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          for name in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SECRET_KEY; do
            value="${!name}"
            test -n "$value"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done

      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run server-backed Golden Session
        run: >-
          pnpm exec playwright test
          tests/e2e/learning-model-v2-server-persistence.spec.ts
          --project=chromium
          --workers=1
          --retries=0

      - name: Stop isolated Supabase
        if: always()
        run: supabase stop --no-backup
