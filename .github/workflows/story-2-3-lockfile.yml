name: Story 2.3 lockfile

on:
  push:
    branches:
      - story/2-3-original-english-eligibility

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story/2-3-original-english-eligibility
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --lockfile-only
      - run: rm .github/workflows/story-2-3-lockfile.yml
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows/story-2-3-lockfile.yml
          git commit -m "build: lock Franc detector dependency"
          git push origin HEAD:story/2-3-original-english-eligibility
