name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
  NEXT_PUBLIC_AUTH_RESEND_COOLDOWN_SECONDS: "1"
  SUPABASE_SECRET_KEY: test-secret-key
  AUTH_ADAPTER: fake
  AUTH_FAKE_CODE: "123456"
  TEST_BETA_EMAILS: invited@example.com,fresh@example.com,learning-preview@example.com
  VIDEO_METADATA_ADAPTER: fixture
  YOUTUBE_VIEWER_REGION: VN
  YOUTUBE_METADATA_TIMEOUT_MS: "1000"
  GENERATION_REPOSITORY: fake
  GENERATION_DISPATCHER: inline
  GENERATION_MAX_ACTIVE_JOBS: "2"
  GENERATION_MAX_JOBS_PER_DAY: "20"
  GENERATION_MAX_JOBS_PER_MINUTE: "3"
  TRANSCRIPT_NATIVE_ENABLED: "true"
  TRANSCRIPT_NATIVE_ADAPTER: fixture
  TRANSCRIPT_REPOSITORY: fake
  SUPADATA_NATIVE_TIMEOUT_MS: "1000"
  LESSON_PROVIDER: fixture
  LEARNING_SESSION_REPOSITORY: fake

jobs:
  static:
    name: Typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run unit tests
        run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Restore Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'public/**', 'next.config.*', 'postcss.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build application
        run: pnpm build

  database:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0
      - name: Show Supabase CLI version
        run: supabase --version
      - name: Rebuild local database from migrations and seed
        run: |
          supabase db start
          supabase db reset --local --yes
      - name: Run pgTAP tests
        run: supabase test db

  e2e:
    name: Chromium product journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Run product journeys
        run: pnpm test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5

  durable_learning:
    name: Supabase-backed learning journey
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AUTH_ADAPTER: fake
      AUTH_FAKE_CODE: "123456"
      TEST_BETA_EMAILS: learning-preview@example.com
      LEARNING_SESSION_REPOSITORY: supabase
      LEARNING_LAB_V2_LESSON_VERSION_ID: 77777777-7777-4777-8777-777777777777
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Chromium headless shell
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Start isolated local Supabase
        run: |
          supabase start
          supabase db reset --local --yes
          supabase test db
      - name: Export local Supabase API credentials
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.service_role_key=SUPABASE_SECRET_KEY \
            > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          for name in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY \
            SUPABASE_SECRET_KEY; do
            value="${!name}"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - name: Run durable Golden Session journey
        run: >-
          pnpm exec playwright test
          tests/e2e/learning-model-v2-server-persistence.spec.ts
          --project=chromium
      - name: Upload durable failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: durable-learning-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5
      - name: Stop isolated local Supabase
        if: always()
        run: supabase stop --no-backup

  gate:
    name: CI gate
    if: always()
    needs:
      - static
      - unit
      - build
      - database
      - e2e
      - durable_learning
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      STATIC_RESULT: ${{ needs.static.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      DATABASE_RESULT: ${{ needs.database.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
      DURABLE_LEARNING_RESULT: ${{ needs.durable_learning.result }}
    steps:
      - name: Publish CI summary
        run: |
          {
            echo "## CI summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Typecheck and lint | $STATIC_RESULT |"
            echo "| Unit tests | $UNIT_RESULT |"
            echo "| Production build | $BUILD_RESULT |"
            echo "| Supabase migration and RLS | $DATABASE_RESULT |"
            echo "| Chromium journeys | $E2E_RESULT |"
            echo "| Supabase-backed learning journey | $DURABLE_LEARNING_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$STATIC_RESULT" \
            "$UNIT_RESULT" \
            "$BUILD_RESULT" \
            "$DATABASE_RESULT" \
            "$E2E_RESULT" \
            "$DURABLE_LEARNING_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more required CI jobs did not succeed."
              exit 1
            fi
          done
