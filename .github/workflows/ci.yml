name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
  NEXT_PUBLIC_AUTH_RESEND_COOLDOWN_SECONDS: "1"
  SUPABASE_SECRET_KEY: test-secret-key
  AUTH_ADAPTER: fake
  AUTH_FAKE_CODE: "123456"
  TEST_BETA_EMAILS: invited@example.com
  VIDEO_METADATA_ADAPTER: fixture
  YOUTUBE_VIEWER_REGION: VN
  YOUTUBE_METADATA_TIMEOUT_MS: "1000"
  GENERATION_REPOSITORY: fake
  GENERATION_DISPATCHER: inline
  GENERATION_MAX_ACTIVE_JOBS: "2"
  GENERATION_MAX_JOBS_PER_DAY: "20"
  GENERATION_MAX_JOBS_PER_MINUTE: "3"
  TRANSCRIPT_NATIVE_ENABLED: "true"
  TRANSCRIPT_NATIVE_ADAPTER: fixture
  TRANSCRIPT_REPOSITORY: fake
  SUPADATA_NATIVE_TIMEOUT_MS: "1000"
  LESSON_PROVIDER: fixture

jobs:
  static:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Run unit tests
        run: pnpm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Restore Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.*', 'tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build application
        run: pnpm build

  database:
    name: Supabase migration and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start local Supabase
        run: supabase start -x studio,imgproxy
      - name: Reset schema and seed
        run: supabase db reset --local
      - name: Run pgTAP tests
        run: supabase test db
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: Chromium product journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run product journeys
        run: pnpm test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5

  gate:
    name: CI gate
    if: always()
    needs:
      - static
      - unit
      - build
      - database
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      STATIC_RESULT: ${{ needs.static.result }}
      UNIT_RESULT: ${{ needs.unit.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      DATABASE_RESULT: ${{ needs.database.result }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - name: Publish CI summary
        run: |
          {
            echo "## CI summary"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Typecheck and lint | $STATIC_RESULT |"
            echo "| Unit tests | $UNIT_RESULT |"
            echo "| Production build | $BUILD_RESULT |"
            echo "| Supabase migration and RLS | $DATABASE_RESULT |"
            echo "| Chromium journeys | $E2E_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$STATIC_RESULT" \
            "$UNIT_RESULT" \
            "$BUILD_RESULT" \
            "$DATABASE_RESULT" \
            "$E2E_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "One or more required CI jobs did not succeed."
              exit 1
            fi
          done
