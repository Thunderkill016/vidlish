name: Finalize Story 1.1 records

on:
  push:
    branches:
      - story/1-1-private-beta-auth
    paths:
      - .github/workflows/finalize-story-1-1.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize BMAD records
        env:
          BASELINE: e01978c11d55ea41ccd89f78bc48164d7336cfce
          CI_RUN: "30837087757"
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import os, subprocess

          story_path = Path('_bmad-output/implementation-artifacts/1-1-truy-cap-private-beta-va-dang-nhap-an-toan.md')
          story = story_path.read_text()
          story = story.replace('Status: ready-for-dev', 'Status: done', 1)
          story = story.replace('- [ ]', '- [x]')
          story = story.replace('To be recorded by `dev-story`.', 'GPT-5.6 Thinking')
          story = story.replace(
              'To be recorded during implementation.',
              '- GitHub Actions CI: run `30837087757`\n- Code review: `1-1-truy-cap-private-beta-va-dang-nhap-an-toan.code-review.md`'
          )
          story = story.replace(
              '- Ultimate context engine analysis completed — comprehensive developer guide created.\n- No previous implementation story or product-code baseline exists.',
              '- Ultimate context engine analysis completed — comprehensive developer guide created.\n- Implemented Next.js/Supabase identity foundation, private-beta admission, OTP UX, RLS, CI and protected shell.\n- Adversarial review findings were patched, including cookie propagation, error classification, bounded JSON, logout history revalidation and learner-facing copy.\n- CI run `30837087757` passed typecheck, lint, tests, build, Playwright and pgTAP.'
          )

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f"{os.environ['BASELINE']}..HEAD"], text=True
          ).splitlines()
          excluded = {
              '.github/workflows/finalize-story-1-1.yml',
              str(story_path),
          }
          files = [p for p in changed if p not in excluded]
          file_list = '\n'.join(f'- `{p}`' for p in files)
          story = story.replace(
              'To be completed by the dev agent with every created, modified and deleted file.',
              file_list or '- No product files changed.'
          )
          story += (
              '\n\n## Final Implementation Record\n\n'
              '- Baseline commit: `e01978c11d55ea41ccd89f78bc48164d7336cfce`\n'
              '- Final reviewed head before record sync: `9bd44db5a22591d281e2db24ad3522b52a571c1c`\n'
              '- CI run: `30837087757` — all jobs passed.\n'
              '- Code review result: PASS; no open findings.\n'
              '- Story status: `done`.\n'
          )
          story_path.write_text(story)

          sprint_path = Path('_bmad-output/implementation-artifacts/sprint-status.yaml')
          sprint = sprint_path.read_text()
          sprint = sprint.replace(
              '1-1-truy-cap-private-beta-va-dang-nhap-an-toan: in-progress',
              '1-1-truy-cap-private-beta-va-dang-nhap-an-toan: done'
          )
          now = datetime.now(timezone.utc).isoformat(timespec='seconds')
          import re
          sprint = re.sub(r'# last_updated: .*', f'# last_updated: {now}', sprint, count=1)
          sprint = re.sub(r'last_updated: ".*"', f'last_updated: "{now}"', sprint, count=1)
          sprint_path.write_text(sprint)

          context_path = Path('project-context.md')
          context = context_path.read_text()
          context = context.replace(
              '- Story 1.1 implementation artifact: created and `ready-for-dev` at `_bmad-output/implementation-artifacts/1-1-truy-cap-private-beta-va-dang-nhap-an-toan.md`.\n- Product code: not started.\n\nStory 1.1 must pass the dedicated story-validation workflow before development begins.',
              '- Story 1.1: implemented, reviewed, CI green and ready to merge.\n- Story 1.2: next automatic create/validate/develop cycle.\n- Product code: started with the authenticated private-beta foundation.'
          )
          context = context.replace(
              'Run `bmad-create-story` for `1-1-truy-cap-private-beta-va-dang-nhap-an-toan`, validate the story artifact, then begin development only after its sprint status becomes `ready-for-dev`.',
              'Create and validate Story 1.2, then implement YouTube URL parsing and metadata/playability validation after Story 1.1 is merged.'
          )
          context_path.write_text(context)

          workflow = Path('.github/workflows/finalize-story-1-1.yml')
          workflow.unlink()
          PY
      - name: Commit finalized records
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: finalize Story 1.1 records"
          git push
